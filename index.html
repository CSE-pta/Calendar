.board-footer{font-size:13px;margin-top:15px;font-style:italic;break-before:avoid;}
@media(max-width:700px){
  body{padding:12px;}
  .board-header{grid-template-columns:62px 1fr 62px;gap:8px;}
  .board-logo-box{width:62px;height:62px;}
  .board-logo{max-width:62px;max-height:62px;}
  .board-title{font-size:25px;}
  .board-columns{column-count:1;}

  .board-event{font-size:16px;}
}

<script>
(function(){
  var EMBEDDED_ITEMS = [];
  var START = new Date('2026-08-01T12:00:00');
  var END = new Date('2027-05-31T12:00:00');

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }

  function parseCsvLine(line){
    var out = [], cur = '', inQuotes = false;
    for(var i=0;i<line.length;i++){
      var ch = line[i];
      if(ch === '"'){
        if(inQuotes && line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if(ch === ',' && !inQuotes){
        out.push(cur); cur = '';
      } else {
        cur += ch;
      }
    }
    out.push(cur);
    return out;
  }

  function parseCsv(text){
    text = String(text || '').replace(/^\uFEFF/, '');
    var lines = text.split(/\r?\n/).filter(function(line){ return line.trim() !== ''; });
    if(!lines.length) return [];
    var headers = parseCsvLine(lines[0]).map(function(h){ return String(h || '').replace(/^\uFEFF/, '').trim(); });
    return lines.slice(1).map(function(line){
      var values = parseCsvLine(line);
      var row = {};
      headers.forEach(function(h, idx){ row[h] = values[idx] == null ? '' : values[idx]; });
      return row;
    });
  }

  function field(row, names){
    var wanted = names.map(function(n){ return String(n).toLowerCase().replace(/[^a-z0-9]/g,''); });
    for(var k in row){
      var kk = String(k || '').replace(/^\uFEFF/, '').toLowerCase().replace(/[^a-z0-9]/g,'');
      if(wanted.indexOf(kk) !== -1) return row[k];
    }
    return '';
  }

  function parseDate(v){
    var raw = String(v || '').trim();
    if(!raw) return null;
    if(/^\d{4}-\d{2}-\d{2}$/.test(raw)){
      var d1 = new Date(raw + 'T12:00:00');
      return isNaN(d1) ? null : d1;
    }
    var m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if(m){
      var y = parseInt(m[3],10);
      if(y < 100) y += 2000;
      var d2 = new Date(y, parseInt(m[1],10)-1, parseInt(m[2],10), 12,0,0);
      return isNaN(d2) ? null : d2;
    }
    return null;
  }

  function dateIso(v){
    var d = parseDate(v);
    if(!d) return '';
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function inRange(date){
    var d = parseDate(date);
    return d && d >= START && d <= END;
  }

  function showValue(raw){
    var v = String(raw == null ? '' : raw).replace(/\u00A0/g,' ').trim().toLowerCase();
    return ['no','n','false','0','hide','hidden','private'].indexOf(v) !== -1 ? 'No' : 'Yes';
  }

  function realCoordinator(raw){
    var v = String(raw == null ? '' : raw).replace(/\u00A0/g,' ').trim();
    if(!v) return '';
    if(/^unassigned$/i.test(v)) return '';
    if(/^open$/i.test(v)) return '';
    if(/^none$/i.test(v)) return '';
    if(v === '-') return '';
    return v;
  }

  function normTime(v){
    v = String(v || '').trim();
    if(!v) return '';
    var ampm = v.match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)$/i);
    if(ampm){
      var h = parseInt(ampm[1],10);
      var min = ampm[2] || '00';
      var p = ampm[3].toUpperCase();
      if(p === 'PM' && h < 12) h += 12;
      if(p === 'AM' && h === 12) h = 0;
      return String(h).padStart(2,'0') + ':' + min;
    }
    return v;
  }

  function fmtTime(v){
    v = String(v || '').trim();
    if(!v) return '';
    var m = v.match(/^(\d{1,2}):(\d{2})/);
    if(m){
      var h = parseInt(m[1],10);
      var min = m[2];
      var ampm = h >= 12 ? 'PM':'AM';
      var hr = h % 12 || 12;
      return hr + (min === '00' ? '' : ':'+min) + ' ' + ampm;
    }
    return v;
  }

  function eventTime(item){
    var s = fmtTime(item.start);
    var e = fmtTime(item.end);
    if(s && e) return s + '–' + e;
    return s;
  }

  function csvRowsToItems(text){
    return parseCsv(text).map(function(row, idx){
      var show = showValue(field(row, ['Show on Website','Website','Public','Show']));
      return {
        id: field(row, ['ID','Id','id']) || String(idx + 1),
        title: String(field(row, ['Function','Title','Event']) || '').trim(),
        date: dateIso(field(row, ['Date'])),
        start: normTime(field(row, ['Start Time','Start'])),
        end: normTime(field(row, ['End Time','End'])),
        coordinator: realCoordinator(field(row, ['Coordinator','Owner'])),
        showOnWebsite: show
      };
    }).filter(function(item){
      return item.title && item.date && item.showOnWebsite !== 'No' && inRange(item.date);
    });
  }

  function monthKey(v){
    var d = parseDate(v);
    if(!d) return '9999-99';
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }

  function monthLabel(key){
    var p = key.split('-');
    return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, 1).toLocaleDateString(undefined,{month:'long'});
  }

  function monthOrderValue(key){
    var p = key.split('-').map(Number);
    if(p[0] === 2026 && p[1] >= 8 && p[1] <= 12) return p[1] - 8;
    if(p[0] === 2027 && p[1] >= 1 && p[1] <= 5) return p[1] + 4;
    return 999;
  }

  function render(items){
    var container = document.getElementById('eventsContainer');
    items = (items || []).sort(function(a,b){
      return (String(a.date||'') + ' ' + String(a.start||'')).localeCompare(String(b.date||'') + ' ' + String(b.start||''));
    });

    if(!items.length){
      container.innerHTML = '<div class="board-event">No public events found for August 2026 through May 2027.</div>';
      return;
    }

    var groups = {};
    items.forEach(function(item){
      var key = monthKey(item.date);
      if(!groups[key]) groups[key] = [];
      groups[key].push(item);
    });

    var keys = Object.keys(groups).sort(function(a,b){ return monthOrderValue(a)-monthOrderValue(b); });

    container.innerHTML = keys.map(function(key){
      var events = groups[key].map(function(item){
        var d = parseDate(item.date);
        var day = d ? d.getDate() : '';
        var t = eventTime(item);
        var coord = item.coordinator ? ' (' + item.coordinator + ')' : '';
        return '<div class="board-event">' + day + ' - ' + esc(item.title) + (t ? ' ' + esc(t) : '') + esc(coord) + '</div>';
      }).join('');
      return '<section class="board-month"><div class="board-month-title">' + monthLabel(key) + '</div>' + events + '</section>';
    }).join('');
  }

  function load(){
    fetch('pta_calendar_functions.csv?v=' + Date.now(), {cache:'no-store'})
      .then(function(resp){
        if(!resp.ok) throw new Error('CSV fetch failed');
        return resp.text();
      })
      .then(function(text){
        var items = csvRowsToItems(text);
        render(items.length ? items : EMBEDDED_ITEMS);
      })
      .catch(function(){
        render(EMBEDDED_ITEMS);
      });
  }

  try {
    load();
  } catch(err) {
    document.getElementById('eventsContainer').innerHTML = '<div class="board-event">Calendar could not load.</div>';
  }
})();
</script>
</body>
</html>
