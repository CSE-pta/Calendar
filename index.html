<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026-2027 PTA Events</title>
<style>
body{margin:0;padding:20px;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#000;}
.wrapper{max-width:1100px;margin:0 auto;}
.header{display:grid;grid-template-columns:90px 1fr 90px;align-items:center;gap:10px;margin-bottom:18px;}
.logo-box{display:flex;align-items:center;justify-content:center;}
.logo-box img{max-width:78px;max-height:78px;object-fit:contain;}
.title-wrap{text-align:center;}
.title{font-size:34px;font-weight:900;line-height:1.05;}
.columns{column-count:2;column-gap:42px;}
.month{break-inside:avoid;margin-bottom:14px;}
.month-title{font-size:24px;font-weight:900;margin-bottom:5px;}
.event{font-size:16px;line-height:1.3;margin-bottom:3px;}
.footer{margin-top:16px;font-size:13px;font-style:italic;}
@media(max-width:700px){
 body{padding:12px;}
 .columns{column-count:1;}
 .title{font-size:28px;}
 .month-title{font-size:22px;}
 .event{font-size:17px;}
}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="logo-box"></div>
    <div class="title-wrap">
      <div class="title">2026-2027 PTA EVENTS</div>
    </div>
    <div class="logo-box"></div>
  </div>

  <div class="columns" id="eventsContainer"></div>

  <div class="footer">Dates and times subject to change</div>
</div>


<script>
(function(){
  const STORAGE_KEYS = [
    'pta_editor_functions_with_show_website_v1',
    'pta_calendar_full_functions_with_show_website',
    'pta_full_editor_functions_source_of_truth'
  ];

  const SCHOOL_YEAR_START = new Date('2026-08-01T12:00:00');
  const SCHOOL_YEAR_END = new Date('2027-05-31T12:00:00');

  function showValue(item){
    const raw = item && (
      item.showOnWebsite ?? item["Show on Website"] ?? item.website ?? ''
    );
    const v = String(raw == null ? '' : raw).trim().toLowerCase();
    return ['no','n','false','0','hide','hidden','private'].includes(v) ? 'No' : 'Yes';
  }

  function loadItems(){
    for(const key of STORAGE_KEYS){
      try{
        const data = JSON.parse(localStorage.getItem(key) || '[]');
        if(Array.isArray(data) && data.length) return data;
      }catch(e){}
    }
    return [];
  }

  function parseDate(v){
    const raw = String(v || '').trim();
    if(!raw) return null;

    if(/^\d{4}-\d{2}-\d{2}$/.test(raw)){
      const d = new Date(raw + 'T12:00:00');
      return isNaN(d) ? null : d;
    }

    const m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if(m){
      let y = parseInt(m[3], 10);
      if(y < 100) y += 2000;
      const d = new Date(y, parseInt(m[1],10)-1, parseInt(m[2],10), 12, 0, 0);
      return isNaN(d) ? null : d;
    }

    const d = new Date(raw + 'T12:00:00');
    return isNaN(d) ? null : d;
  }

  function inSchoolYear(item){
    const d = parseDate(item && item.date);
    return d && d >= SCHOOL_YEAR_START && d <= SCHOOL_YEAR_END;
  }

  function monthKey(v){
    const d = parseDate(v);
    if(!d) return '9999-99';
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }

  function monthLabel(key){
    const p = key.split('-');
    return new Date(parseInt(p[0]), parseInt(p[1])-1, 1)
      .toLocaleDateString(undefined,{month:'long'});
  }

  function monthOrderValue(key){
    const parts = key.split('-').map(Number);
    const year = parts[0];
    const month = parts[1];
    if(year === 2026 && month >= 8 && month <= 12) return month - 8;
    if(year === 2027 && month >= 1 && month <= 5) return month + 4;
    return 999;
  }

  function fmtTime(v){
    v = String(v || '').trim();
    if(!v) return '';
    const m = v.match(/^(\d{1,2}):(\d{2})/);
    if(m){
      const h = parseInt(m[1],10);
      const min = m[2];
      const ampm = h >= 12 ? 'PM':'AM';
      const hr = h % 12 || 12;
      return hr + (min === '00' ? '' : ':'+min) + ' ' + ampm;
    }
    return v;
  }

  function eventTime(item){
    const s = fmtTime(item.start);
    const e = fmtTime(item.end);
    if(s && e) return s + '–' + e;
    return s;
  }

  function build(){
    const container = document.getElementById('eventsContainer');

    const items = loadItems()
      .filter(i => i && i.date && i.title && showValue(i) !== 'No' && inSchoolYear(i))
      .sort((a,b)=>{
        const da = parseDate(a.date);
        const db = parseDate(b.date);
        const ad = da ? da.getTime() : 0;
        const bd = db ? db.getTime() : 0;
        if(ad !== bd) return ad - bd;
        return String(a.start || '').localeCompare(String(b.start || ''));
      });

    const groups = {};
    items.forEach(item=>{
      const key = monthKey(item.date);
      if(!groups[key]) groups[key] = [];
      groups[key].push(item);
    });

    const monthKeys = Object.keys(groups).sort((a,b)=>monthOrderValue(a)-monthOrderValue(b));

    container.innerHTML = monthKeys.map(key=>{
      const events = groups[key].map(item=>{
        const d = parseDate(item.date);
        const day = d ? d.getDate() : '';
        const t = eventTime(item);
        return `<div class="event">${day} - ${item.title}${t ? ' ' + t : ''}</div>`;
      }).join('');

      return `<section class="month">
        <div class="month-title">${monthLabel(key)}</div>
        ${events}
      </section>`;
    }).join('');
  }

  build();
})();
</script>

</body>
</html>
